services:
  - type: web
    name: quetie-mbg
    env: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://your-render-app.onrender.com
      - key: MAX_QUEUE_SIZE
        value: '500'
      - key: LOG_LEVEL
        value: INFO
